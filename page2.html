<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="#0000 ;">
    <h1 style="font-size: 45px; color: rgb(8, 255, 20);"align="center" >Register your account:</h1>
    <fieldset  align="center" style="width: max-content; margin: 0 auto; padding: 40px;">
        <form>
            <label for="full-name" style="color: rgb(8, 255, 20);">First Name..:</label>
            <input type="text" placeholder="Enter your first name">
            <br>
            <br>
            <label for="last name" style="color: rgb(8, 255, 20);">Last name...:</label>
            <input type="text" placeholder="Enter your last name">
            <br>
            <br>
            <label for="Username" style="color: rgb(8, 255, 20);">Username....:</label>
            <input type="text" placeholder="Create an username">
            <br>
            <br>
            <label for="password" style="color: rgb(8, 255, 20);">Password.....:</label>
            <input type="password" placeholder="Create a strong password">
            <br>
            <br>
            <label for="password" style="color: rgb(8, 255, 20);">Retype Pass.:</label>
            <input type="password" placeholder="Retype your password">
            <br>
            <br>
            <label for="email" style="color: rgb(8, 255, 20);">Email...........:</label>
            <input type="email" placeholder="example@gmail.com">
            <br>
            <br>
            <label for="number" style="color: rgb(8, 255, 20);">Enter Code..:</label>
            <input type="number" placeholder="Enter your code">
            <br>
            <br>
            <label for="number" style="color: rgb(8, 255, 20);">Enter age.....:</label>
            <input type="number" placeholder="Enter your age" max="100" min="18">
            <br>
            <br>
            <input style="color: rgb(8, 255, 20);" type="submit" value="Register">
            <a href="index.html" style="color: rgb(8, 255, 20);">Log In</a>
        </form>
    </fieldset>
</body>
</html>
